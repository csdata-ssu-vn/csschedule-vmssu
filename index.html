<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: quan trọng trên iPhone có notch/thanh cử chỉ,
       để iframe phủ đúng toàn bộ màn hình thật, không bị hụt. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lịch làm</title>
  <style>
    /* Reset để KHÔNG có bất kỳ margin/padding/theme nào của GitHub Pages
     * (nếu bạn dùng theme Jekyll mặc định) chen vào — nếu không, chiều
     * cao 100% sẽ bị cộng dồn sai và gây ra đúng lỗi 2 lớp cuộn đè nhau. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh; /* mobile: tính đúng viewport thật, không bị lệch khi thanh địa chỉ ẩn/hiện */
      overflow: hidden; /* trang NGOÀI không tự cuộn — để app BÊN TRONG iframe tự lo phần cuộn của nó */
      background: #eef2fb;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
    }
  </style>
</head>
<body>
  <!--
    Thay đúng link Web App bạn đã Deploy (kết thúc bằng /exec) vào src bên dưới.
    Lấy link này ở: Apps Script editor > Deploy > Manage deployments > copy "Web app URL".
  -->
  <iframe
    src="https://script.google.com/a/macros/shopeemobile-external.com/s/AKfycbzF4wGzBsM_NPweM4-oyPXnnwNo0XcJszRR4WKI24QwGlT6xt1exim0b1EM4Irlw4Qn/exec"
    title="Lịch làm"
    allow="clipboard-write"
  ></iframe>
</body>
</html>
