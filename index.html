<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIỆT MỸ SSU - SHOPEE CS</title>
    <style>
        /* Reset hoàn toàn lề và khoảng trắng của trình duyệt */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Ẩn thanh cuộn thừa ngoài cùng của trình duyệt */
            background-color: #ffffff;
        }

        /* Ép iframe phủ kín 100% kích thước màn hình */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe src="https://script.google.com/a/macros/shopeemobile-external.com/s/AKfycbzF4wGzBsM_NPweM4-oyPXnnwNo0XcJszRR4WKI24QwGlT6xt1exim0b1EM4Irlw4Qn/exec" 
            allow="geolocation; microphone; camera; clipboard-write;"
            scrolling="yes">

</body>
</html>
